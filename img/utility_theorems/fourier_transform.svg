<svg width="680" height="300" viewBox="0 0 680 300" role="img" xmlns="http://www.w3.org/2000/svg" style="background:transparent">
  <title>Transformada de Fourier |Vs(ω)|</title>
  <desc>Espectro continuo de amplitud de la señal arbitraria vs(t), mostrando energía concentrada en bajas frecuencias con caída irregular hacia altas frecuencias.</desc>
  <defs>
    <marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Axes: origin at (70, 240) -->
  <line x1="70" y1="20" x2="70" y2="258" stroke="white" stroke-width="1.3" marker-end="url(#arrowW)"/>
  <line x1="50" y1="240" x2="650" y2="240" stroke="white" stroke-width="1.3" marker-end="url(#arrowW)"/>

  <!-- Axis labels -->
  <text x="55" y="18" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="13" font-style="italic" fill="white">|V</text>
  <text x="68" y="22" text-anchor="start" font-family="Georgia,'Times New Roman',serif" font-size="9" fill="white">s</text>
  <text x="73" y="18" text-anchor="start" font-family="Georgia,'Times New Roman',serif" font-size="13" font-style="italic" fill="white">(&#x3C9;)|</text>
  <text x="638" y="258" text-anchor="start" font-family="Georgia,'Times New Roman',serif" font-size="13" font-style="italic" fill="white">&#x3C9;</text>
  <text x="62" y="257" text-anchor="end" font-family="Georgia,'Times New Roman',serif" font-size="13" fill="white">0</text>

  <!-- Continuous spectrum: starts high at ω=0, irregular decay with bumps -->
  <!-- Peak at origin ~y=42 (height 198px), then falls with local bumps -->
  <path
    d="
      M 70,240
      C 70,240 71,100 80,55
      C 85,38  92,35  100,40
      C 110,47  118,60  128,75
      C 138,90  146,100 158,108
      C 168,115 178,110 190,118
      C 200,125 208,138 220,148
      C 232,158 242,162 255,168
      C 268,174 278,172 292,176
      C 306,180 318,182 333,186
      C 348,190 362,191 378,193
      C 394,195 410,196 428,197
      C 448,198 468,199 490,200
      C 515,201 540,202 570,204
      C 595,205 615,208 635,212
    "
    fill="none"
    stroke="white"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
