<svg width="680" height="320" viewBox="0 0 680 320" role="img" xmlns="http://www.w3.org/2000/svg" style="background:transparent">
  <title>Señal cuadrada entre -V y V con periodo T</title>
  <desc>Señal cuadrada simétrica oscilando entre -V y +V, con el periodo T marcado en la parte superior.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Axes -->
  <line x1="80" y1="20" x2="80" y2="280" stroke="white" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="60" y1="160" x2="650" y2="160" stroke="white" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Axis labels: italic serif = LaTeX style -->
  <text x="72" y="14" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="16" font-style="italic" fill="white">v</text>
  <text x="648" y="175" text-anchor="start" font-family="Georgia,'Times New Roman',serif" font-size="16" font-style="italic" fill="white">t</text>

  <!-- Amplitude tick marks on v-axis -->
  <line x1="75" y1="80" x2="85" y2="80" stroke="white" stroke-width="1.2"/>
  <line x1="75" y1="240" x2="85" y2="240" stroke="white" stroke-width="1.2"/>

  <!-- Amplitude labels -->
  <text x="68" y="85" text-anchor="end" font-family="Georgia,'Times New Roman',serif" font-size="14" font-style="italic" fill="white">+V</text>
  <text x="68" y="245" text-anchor="end" font-family="Georgia,'Times New Roman',serif" font-size="14" font-style="italic" fill="white">&#x2212;V</text>
  <text x="68" y="165" text-anchor="end" font-family="Georgia,'Times New Roman',serif" font-size="14" fill="white">0</text>

  <!-- Square wave starting at x=80 (origin), 2 full periods -->
  <!-- Each half-period = 130px, full period = 260px -->
  <!-- Starts at y=160 (zero), rises to y=80 (+V) immediately -->
  <polyline
    points="80,160 80,80 210,80 210,240 340,240 340,80 470,80 470,240 600,240 600,160"
    fill="none"
    stroke="white"
    stroke-width="2.2"
    stroke-linejoin="miter"
    stroke-linecap="square"
  />

  <!-- Period T annotation: above the wave, between x=80 and x=340 -->
  <!-- Vertical drop lines from y=50 down to y=65 -->
  <line x1="80"  y1="50" x2="80"  y2="68" stroke="white" stroke-width="1.1"/>
  <line x1="340" y1="50" x2="340" y2="68" stroke="white" stroke-width="1.1"/>
  <!-- Horizontal double-arrow at y=50 -->
  <line x1="80" y1="50" x2="340" y2="50" stroke="white" stroke-width="1.1"
    marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <!-- T label centered above -->
  <text x="210" y="44" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="16" font-style="italic" font-weight="500" fill="white">T</text>
</svg>
